
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Credit Risk Prediction</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #eef2ff;
    margin: 0;
    padding: 30px 15px;
    color: #222;
}

.container {
    max-width: 650px;
    margin: auto;
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 5px 20px #ccd2e5;
}

h1 {
    text-align: center;
    color: #263b80;
}

.subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 25px;
}

label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
}

input, select {
    width: 100%;
    padding: 12px;
    margin-top: 7px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 15px;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 25px;
    background: #263b80;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 17px;
    cursor: pointer;
}

button:hover {
    background: #17265c;
}

#result {
    margin-top: 25px;
    padding: 15px;
    text-align: center;
    border-radius: 8px;
    font-weight: bold;
    display: none;
}

.low {
    background: #d9fbe5;
    color: #087333;
}

.high {
    background: #ffe0e0;
    color: #b00020;
}

.error {
    background: #fff0d5;
    color: #8a4b00;
}

.note {
    text-align: center;
    color: #777;
    font-size: 12px;
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">

<h1>Credit Risk Prediction</h1>
<p class="subtitle">Machine Learning Based Loan Default Risk Assessment</p>

<form id="riskForm">

<label>Applicant ID</label>
<input type="text" id="applicant_id" value="APP001" required>

<label>Age</label>
<input type="number" id="age" min="18" required>

<label>Monthly Income (₹)</label>
<input type="number" id="income" min="0" required>

<label>Employment Type</label>
<select id="employment" required>
<option value="Salaried">Salaried</option>
<option value="Self-employed">Self-employed</option>
</select>

<label>Credit Score</label>
<input type="number" id="score" min="300" max="900" required>

<label>Loan Amount (₹)</label>
<input type="number" id="loan" min="1" required>

<label>Loan Term (Months)</label>
<input type="number" id="term" min="1" required>

<label>Existing Loans</label>
<input type="number" id="existing" min="0" required>

<label>Debt to Income Ratio</label>
<input type="number" id="dti" min="0" max="1" step="0.01" required>

<label>City Tier</label>
<select id="city" required>
<option value="Tier 1">Tier 1</option>
<option value="Tier 2">Tier 2</option>
<option value="Tier 3">Tier 3</option>
</select>

<label>Education</label>
<select id="education" required>
<option value="Graduate">Graduate</option>
<option value="Postgraduate">Postgraduate</option>
<option value="Undergraduate">Undergraduate</option>
</select>

<button type="submit" id="predictBtn">Predict Credit Risk</button>

</form>

<div id="result"></div>

<p class="note">
Educational demonstration using synthetic practice data.
Not intended for real loan approval decisions.
</p>

</div>

<script>
const form = document.getElementById("riskForm");

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const result = document.getElementById("result");
    const button = document.getElementById("predictBtn");

    const data = {
        applicant_id: document.getElementById("applicant_id").value,
        age: Number(document.getElementById("age").value),
        monthly_income_inr: Number(document.getElementById("income").value),
        employment_type: document.getElementById("employment").value,
        credit_score: Number(document.getElementById("score").value),
        loan_amount_inr: Number(document.getElementById("loan").value),
        loan_term_months: Number(document.getElementById("term").value),
        existing_loans: Number(document.getElementById("existing").value),
        debt_to_income_ratio: Number(document.getElementById("dti").value),
        city_tier: document.getElementById("city").value,
        education: document.getElementById("education").value
    };

    button.disabled = true;
    button.innerText = "Predicting...";
    result.style.display = "block";
    result.className = "";
    result.innerText = "Please wait...";

    try {
        const response = await fetch("/api/predict", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        });

        const output = await response.json();

        if (!response.ok) {
            throw new Error(output.error || "Prediction failed");
        }

        const percentage = (output.probability * 100).toFixed(1);

        result.className =
            output.risk === "High Risk" ? "high" : "low";

        result.innerHTML =
            "<h2>" + output.risk + "</h2>" +
            "<p>Default Probability: " + percentage + "%</p>";

    } catch (error) {
        result.className = "error";
        result.innerText = "Error: " + error.message;
    }

    button.disabled = false;
    button.innerText = "Predict Credit Risk";
});
</script>

</body>
</html>
